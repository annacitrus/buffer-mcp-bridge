# No cloud resources or paid plans. Requires Docker Desktop and a logged-in Tailscale client.
name: buffer-bridge-laptop
services:
  db:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: ${BRIDGE_DB_PASSWORD:?Run prepare-laptop first}
    volumes: [bridge_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bridge -d bridge]
      interval: 5s
      timeout: 3s
      retries: 20
  auth-db:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Run prepare-laptop first}
    volumes: [auth_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak -d keycloak]
      interval: 5s
      timeout: 3s
      retries: 20
  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: [start, --import-realm, --features=resource-indicators]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: ${PUBLIC_URL}/identity
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - ../secrets/laptop-realm.json:/opt/keycloak/data/import/bridge-realm.json:ro
    depends_on:
      auth-db: { condition: service_healthy }
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env.laptop
    environment:
      ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
      BUFFER_CONTRACT_FILE: /run/secrets/buffer_contract
    secrets: [encryption_keys, buffer_contract]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 50s
    depends_on:
      db: { condition: service_healthy }
      identity: { condition: service_started }
  gateway:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports: [127.0.0.1:8085:8085]
    volumes:
      - ./laptop.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [identity]
secrets:
  encryption_keys: { file: ../secrets/encryption-keys.json }
  buffer_contract: { file: ../config/buffer-contract.json }
volumes:
  bridge_data:
  auth_data:
